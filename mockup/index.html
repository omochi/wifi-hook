<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fi Hook — 動作モック</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#202027;background:#141922}button,input,textarea{font:inherit}button{cursor:pointer} .desktop{height:100vh;min-height:650px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 64% 88%,#f4b389 0,transparent 35%),radial-gradient(ellipse at 27% 82%,#8e547b 0,transparent 40%),linear-gradient(150deg,#547a9f 3%,#86b1ca 40%,#d5b4ba 75%,#6d5b87 100%)}.desktop:before{content:'';position:absolute;inset:25% -10% -45%;background:linear-gradient(135deg,#566d9a99,#df9ba399);border-radius:50% 50% 0 0;transform:rotate(-12deg);filter:blur(25px)}.menubar{height:30px;background:#f4edf2a8;backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-size:13px;font-weight:600;position:relative;z-index:5}.menu-left,.menu-right{display:flex;align-items:center;gap:19px}.menubar button{border:0;background:none;padding:3px;color:inherit}.apple{font-size:18px}.badge{position:absolute;top:46px;left:22px;color:white;font-size:12px;text-shadow:0 1px 6px #0008}.badge strong{display:block;font-size:14px;margin-bottom:4px}.window{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(850px,calc(100% - 64px));height:min(585px,calc(100% - 160px));min-height:450px;border-radius:12px;background:#f6f6f8;box-shadow:0 25px 80px #24203370,0 2px 8px #0003;overflow:hidden;display:flex;z-index:2}.sidebar{width:210px;flex:none;background:#e5e5eabf;border-right:1px solid #0000000d;padding:16px 10px}.traffic{display:flex;gap:8px;margin:2px 0 31px 4px}.traffic button{border:0;border-radius:50%;width:12px;height:12px;padding:0;background:#ff5f57}.traffic button:nth-child(2){background:#febc2e}.traffic button:nth-child(3){background:#28c840}.sidebar h5{margin:0 9px 10px;color:#777783;font-size:11px;letter-spacing:.04em}.nav{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:6px;background:transparent;padding:8px 10px;color:#44444e;font-size:13px}.nav b{color:#548bd7;font-size:15px;width:18px;text-align:center}.nav.active{background:#c9c9d1;color:#16161a;font-weight:600}.main{flex:1;overflow:auto;padding:34px 42px 30px}.main h1{font-size:25px;letter-spacing:-.03em;margin:0 0 5px}.sub{font-size:13px;color:#85858e;margin:0 0 25px}.section-label{font-size:12px;font-weight:600;color:#777782;margin:22px 0 8px 2px}.card{background:#fff;border:1px solid #e6e6e9;border-radius:10px;overflow:hidden}.row{min-height:51px;display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid #eeeef1;font-size:13px}.row:last-child{border:0}.row .grow{flex:1}.muted{color:#888893}.small{font-size:11px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#31bd68;margin-right:6px}.dot.off{background:#999}.pill{font-size:11px;color:#248451;background:#e9f8ee;padding:4px 8px;border-radius:20px}.btn{border:1px solid #d3d3d7;border-radius:6px;background:linear-gradient(#fff,#f5f5f6);padding:6px 12px;font-size:12px;color:#333;box-shadow:0 1px 1px #0000000c}.primary{background:#087aff;color:white;border-color:#087aff}.switch{border:0;background:#c6c6cb;border-radius:20px;width:32px;height:19px;padding:2px;flex:none}.switch:after{content:'';display:block;background:white;height:15px;width:15px;border-radius:50%;box-shadow:0 1px 3px #0003}.switch.on{background:#36c46b}.switch.on:after{transform:translateX(13px)}.dock{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;align-items:end;gap:9px;padding:8px 11px 7px;border:1px solid #ffffff73;border-radius:19px;background:#ffffff55;backdrop-filter:blur(30px);box-shadow:0 4px 18px #0003;z-index:6}.dock button{border:0;background:transparent;padding:0;position:relative}.dockicon,.appicon{display:grid;place-items:center;border-radius:13px;width:49px;height:49px;font-size:25px;box-shadow:0 3px 8px #0002}.finder{background:linear-gradient(90deg,#8dc9fa 50%,#f3f8fe 50%);color:#225f9f}.hook{background:linear-gradient(155deg,#78c1fb,#2466da);color:white;font-size:27px;font-weight:300}.folder{background:linear-gradient(#a2d7ff,#5ba7e7);color:white}.dock .running:after{content:'';position:absolute;bottom:-5px;left:23px;width:4px;height:4px;background:#333;border-radius:50%}.popover{position:absolute;z-index:9;right:75px;top:34px;width:235px;background:#f8f8f9ed;backdrop-filter:blur(24px);box-shadow:0 8px 30px #0004;border:1px solid #fff8;border-radius:10px;padding:8px;font-size:13px}.popover button{display:block;border:0;background:none;width:100%;text-align:left;padding:8px;border-radius:5px}.popover button:hover{background:#087aff;color:white}.notification{position:absolute;right:18px;top:45px;width:300px;padding:13px;background:#f9f9f9e8;backdrop-filter:blur(25px);border:1px solid #fff9;border-radius:13px;box-shadow:0 9px 30px #0003;z-index:8;cursor:pointer;font-size:12px}.notification strong{display:block;margin-bottom:4px}.notification .nhead{display:flex;align-items:center;gap:8px;color:#777;font-size:10px;margin-bottom:8px}.miniicon{display:inline-grid;place-items:center;border-radius:5px;background:#448eea;color:white;width:20px;height:20px;font-size:14px}.installer{display:block;text-align:center;padding:0}.installer .topbar{height:51px;background:#ececee;border-bottom:1px solid #d5d5d9;display:flex;align-items:center;padding:0 16px}.installer .traffic{margin:0}.installer .title{margin:auto;font-weight:600;font-size:13px}.install-body{padding:50px 20px}.install-body h1{font-size:22px;margin:0 0 8px}.install-body p{font-size:13px;color:#777;margin:0}.install-icons{display:flex;align-items:center;justify-content:center;gap:35px;margin:52px 0 35px}.install-icons button{border:0;background:none;color:#333;font-size:12px}.install-icons .appicon{width:76px;height:76px;border-radius:19px;font-size:40px;margin:0 auto 9px}.arrow{font-size:30px;color:#a3a3ac}.modal-back{position:absolute;inset:0;background:#0003;display:grid;place-items:center;z-index:10}.modal{width:min(410px,90%);padding:25px;background:#f9f9fa;border-radius:13px;box-shadow:0 15px 50px #0004}.modal h2{font-size:17px;margin:0 0 8px}.modal p{font-size:13px;color:#666;line-height:1.6}.modal .actions{display:flex;justify-content:end;gap:8px;margin-top:20px}.field{display:block;font-size:12px;color:#666;margin:13px 0 5px}.input{width:100%;border:1px solid #c9c9ce;border-radius:6px;padding:8px;background:white;font-size:13px}.textarea{height:75px;resize:vertical;font-family:monospace}.empty{padding:22px;text-align:center;color:#999;font-size:13px}.guide{position:absolute;bottom:30px;left:22px;font-size:11px;color:#fff;text-shadow:0 1px 4px #0009;line-height:1.6}.guide button{border:0;background:#ffffff3b;color:white;border-radius:5px;padding:4px 8px;margin-top:5px}.hidden{display:none!important}@media(max-width:680px){.sidebar{width:145px}.main{padding:25px 18px}.menu-left span:not(:first-child){display:none}.guide{display:none}.notification{width:240px}.window{width:calc(100% - 24px)}.badge{display:none}}
</style></head><body><div class="desktop"><div class="menubar"><div class="menu-left"><span class="apple">●</span><strong id="activeApp">Finder</strong><span>ファイル</span><span>編集</span><span>表示</span><span>ウインドウ</span></div><div class="menu-right"><button id="hookMenuButton" class="hidden" title="Wi-Fi Hook">⌁</button><button id="wifiButton" title="Wi-Fi">◉</button><span>◕</span><span id="clock">11月2日 月 19:41</span></div></div><div class="badge"><strong>Wi-Fi Hook</strong>インタラクティブモック · 架空の macOS</div><div id="popover" class="popover hidden"></div><div id="notification" class="notification hidden" role="button" tabindex="0"></div><div id="window" class="window"></div><div class="guide">これは見た目と操作のモックです。<br>実際の Wi-Fi やファイルは変更しません。<br><button id="reset">最初からやり直す</button></div><div class="dock"><button title="Finder"><span class="dockicon finder">☺</span></button><button id="dockApp" title="Wi-Fi Hook" class="hidden"><span class="dockicon hook">⌁</span></button><span style="height:38px;border-left:1px solid #ffffff80"></span><button title="アプリケーション"><span class="dockicon folder">A</span></button><button title="ゴミ箱"><span class="dockicon" style="background:#ffffffaa">▤</span></button></div><div id="modal" class="modal-back hidden"></div></div>
<script>
const $=s=>document.querySelector(s);let s={installed:false,open:false,running:false,monitoring:true,setup:false,location:false,notifications:false,login:true,menu:true,wifi:'Home Wi-Fi',page:'status',rules:[],last:null};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function modal(content){$('#modal').innerHTML=`<div class="modal">${content}</div>`;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}function install(){s.installed=true;modal(`<h2>アプリケーションに追加しました</h2><p>「Wi-Fi Hook.app」を開いて、初回設定を始めます。</p><div class="actions"><button class="btn primary" onclick="closeModal();launch()">アプリを開く</button></div>`);render()}function launch(){s.open=true;s.running=true;s.page=s.setup?'status':'general';s.setup=true;$('#notification').classList.add('hidden');render()}function closeWindow(){s.open=false;render()}function quit(){s.running=false;s.open=false;$('#popover').classList.add('hidden');render()}function toggle(k){s[k]=!s[k];render()}function notify(title,body){if(!s.notifications)return;$('#notification').innerHTML=`<div class="nhead"><span class="miniicon">⌁</span> WI-FI HOOK <span style="margin-left:auto">今</span></div><strong>${esc(title)}</strong><div>${esc(body)}</div><div class="small muted" style="margin-top:8px">クリックして詳細を表示</div>`;$('#notification').classList.remove('hidden')}function connect(name){s.wifi=name;$('#popover').classList.add('hidden');if(s.running&&s.monitoring){let rule=s.rules.find(r=>r.wifi===name);if(rule){s.last={wifi:name,script:rule.script,time:'たった今'};notify('スクリプトを実行しました',name+' · 正常に終了しました')}}render()}function pop(which){let el=$('#popover');if(!el.classList.contains('hidden')&&el.dataset.which===which){el.classList.add('hidden');return}el.dataset.which=which;el.classList.remove('hidden');el.innerHTML=which==='wifi'?`<div style="padding:6px 8px;font-weight:600">Wi-Fi <span style="float:right;color:#34b869">オン</span></div><div style="padding:5px 8px;color:#888;font-size:11px">ネットワークを切り替える</div>${['Home Wi-Fi','Office Wi-Fi','Cafe Wi-Fi'].map(n=>`<button onclick="connect('${n}')">${s.wifi===n?'✓':'　'} ${n}</button>`).join('')}`:`<div style="padding:8px;font-weight:600">Wi-Fi Hook</div><div style="padding:3px 8px;color:#777">${s.monitoring?'● 監視中':'○ 監視停止中'} · ${esc(s.wifi)}</div><button onclick="$('#popover').classList.add('hidden');launch()">設定を開く</button><button onclick="quit()">Wi-Fi Hook を終了</button>`}function edit(i=-1){let r=s.rules[i]||{wifi:'',script:'',dir:''};modal(`<h2>${i<0?'Wi-Fi の設定を追加':'Wi-Fi の設定を編集'}</h2><p>この Wi-Fi に接続したときに実行する内容を設定します。</p><label class="field" for="fWifiChoice">一覧から選択</label><select class="input" id="fWifiChoice" onchange="if(this.value) $('#fWifi').value=this.value"><option value="">Wi-Fi を選択（架空の一覧）</option><optgroup label="周囲のネットワーク"><option value="Home Wi-Fi">Home Wi-Fi${s.wifi==='Home Wi-Fi'?'（接続中）':''}</option><option value="Office Wi-Fi">Office Wi-Fi${s.wifi==='Office Wi-Fi'?'（接続中）':''}</option><option value="Cafe Wi-Fi">Cafe Wi-Fi${s.wifi==='Cafe Wi-Fi'?'（接続中）':''}</option></optgroup><optgroup label="保存済みのネットワーク"><option value="Library Wi-Fi">Library Wi-Fi</option></optgroup></select><label class="field" for="fWifi">Wi-Fi 名（直接入力もできます）</label><input class="input" id="fWifi" placeholder="例: Home Wi-Fi" value="${esc(r.wifi)}"><label class="field" for="fScript">スクリプト</label><textarea class="input textarea" id="fScript">${esc(r.script)}</textarea><label class="field" for="fDir">作業ディレクトリ（任意）</label><input class="input" id="fDir" value="${esc(r.dir)}"><div class="actions">${i>=0?`<button class="btn" style="margin-right:auto;color:#d44" onclick="s.rules.splice(${i},1);closeModal();render()">削除</button>`:''}<button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="saveRule(${i})">保存</button></div>`)}function saveRule(i){let wifi=$('#fWifi').value.trim(),script=$('#fScript').value.trim(),dir=$('#fDir').value.trim();if(!wifi||!script){alert('Wi-Fi 名とスクリプトを入力してください。');return}if(i<0)s.rules.push({wifi,script,dir});else s.rules[i]={wifi,script,dir};closeModal();render()}function section(){if(s.page==='status')return `<h1>監視状態</h1><p class="sub">Wi-Fi の接続先とスクリプトの実行状況を確認します。</p><div class="section-label">現在の状態</div><div class="card"><div class="row"><div class="grow"><strong>Wi-Fi を監視</strong><div class="small muted">${s.monitoring?'監視中':'監視を停止中'}</div></div><button class="switch ${s.monitoring?'on':''}" onclick="toggle('monitoring')" role="switch" aria-checked="${s.monitoring}" aria-label="Wi-Fi を監視"></button></div><div class="row"><span class="grow">接続中の Wi-Fi</span><strong>${s.location?esc(s.wifi):'位置情報の許可が必要です'}</strong></div><div class="row"><span class="grow">一致する設定</span><span class="muted">${s.rules.some(r=>r.wifi===s.wifi)?'登録済み':'なし'}</span></div></div><div class="section-label">最後の実行</div><div class="card">${s.last?`<div class="row"><span class="dot"></span><div class="grow"><strong>正常に終了しました</strong><div class="small muted">${esc(s.last.wifi)} · ${esc(s.last.time)}</div></div></div>`:'<div class="empty">まだスクリプトは実行されていません</div>'}</div><p class="small muted" style="margin-top:20px">ウインドウを閉じてもアプリは動作を続けます。監視のオン・オフはいつでも変更できます。</p>`;if(s.page==='rules')return `<div style="display:flex;align-items:start"><div class="grow"><h1>Wi-Fi の設定</h1><p class="sub">接続先ごとに実行するスクリプトを設定します。</p></div><button class="btn primary" onclick="edit()">＋ 追加</button></div><div class="card">${s.rules.length?s.rules.map((r,i)=>`<div class="row"><span style="font-size:19px;color:#448eea">◉</span><div class="grow"><strong>${esc(r.wifi)}</strong><div class="small muted">${esc(r.script)}</div></div><button class="btn" onclick="edit(${i})">編集</button></div>`).join(''):'<div class="empty">設定はまだありません。<br><br>「＋ 追加」から Wi-Fi とスクリプトを登録します。</div>'}</div><p class="small muted" style="margin-top:15px">右上の Wi-Fi メニューから接続先を切り替えて、動作を試せます。</p>`;return `<h1>アプリの設定</h1><p class="sub">起動や表示、権限の設定を確認します。</p><div class="section-label">起動と表示</div><div class="card"><div class="row"><div class="grow">ログイン時に起動<div class="small muted">ログイン後、自動的に監視を始めます</div></div><button class="switch ${s.login?'on':''}" onclick="toggle('login')" aria-label="ログイン時に起動"></button></div><div class="row"><div class="grow">メニューバーに表示<div class="small muted">接続先と監視状態をすばやく確認します</div></div><button class="switch ${s.menu?'on':''}" onclick="toggle('menu')" aria-label="メニューバーに表示"></button></div></div><div class="section-label">権限</div><div class="card"><div class="row"><div class="grow">位置情報<div class="small muted">Wi-Fi 名の取得に必要です</div></div><button class="btn" onclick="toggle('location')">${s.location?'許可済み':'許可する'}</button></div><div class="row"><div class="grow">通知<div class="small muted">実行結果をお知らせします</div></div><button class="btn" onclick="toggle('notifications')">${s.notifications?'許可済み':'許可する'}</button></div></div>`}function render(){let w=$('#window');$('#activeApp').textContent=s.open?'Wi-Fi Hook':'Finder';$('#hookMenuButton').classList.toggle('hidden',!(s.menu&&s.running));$('#dockApp').classList.toggle('hidden',!s.installed);$('#dockApp').classList.toggle('running',s.running);if(!s.installed){w.classList.remove('hidden');w.className='window installer';w.innerHTML=`<div class="topbar"><div class="traffic"><button onclick="this.closest('.window').classList.add('hidden')"></button><button></button><button></button></div><div class="title">Wi-Fi Hook</div></div><div class="install-body"><h1>Wi-Fi Hook</h1><p>アプリをアプリケーションフォルダに追加します。</p><div class="install-icons"><button onclick="install()"><span class="appicon hook">⌁</span>Wi-Fi Hook.app</button><span class="arrow">→</span><button onclick="install()"><span class="appicon folder">A</span>アプリケーション</button></div><button class="btn primary" onclick="install()">アプリケーションに追加</button><p style="margin-top:16px;font-size:11px">モックではクリックでインストールを再現します</p></div>`;return}w.className='window';w.classList.toggle('hidden',!s.open);if(!s.open)return;w.innerHTML=`<aside class="sidebar"><div class="traffic"><button title="ウインドウを閉じる" onclick="closeWindow()"></button><button onclick="closeWindow()"></button><button></button></div><h5>WI-FI HOOK</h5><button class="nav ${s.page==='status'?'active':''}" onclick="s.page='status';render()"><b>◉</b> 監視状態</button><button class="nav ${s.page==='rules'?'active':''}" onclick="s.page='rules';render()"><b>☷</b> Wi-Fi の設定</button><button class="nav ${s.page==='general'?'active':''}" onclick="s.page='general';render()"><b>⚙</b> アプリの設定</button></aside><main class="main">${section()}</main>`}$('#wifiButton').onclick=()=>pop('wifi');$('#hookMenuButton').onclick=()=>pop('hook');$('#dockApp').onclick=()=>launch();$('#notification').onclick=()=>{s.page='status';launch()};$('#reset').onclick=()=>{location.reload()};render();
</script></body></html>
